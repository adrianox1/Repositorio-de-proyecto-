# ============================================================
# Levanta TODO el proyecto con un solo comando:  docker compose up --build
#   - mysql: base de datos MySQL 8 (con datos persistentes)
#   - app:   el backend Spring Boot + frontend
# La app se conecta a MySQL por el nombre de servicio "mysql" (red interna).
# ============================================================

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-diego123}
      MYSQL_DATABASE: ${DB_NAME:-WauPiura}
    ports:
      - "3307:3306"   # Workbench puede conectarse en 127.0.0.1:3307 (no choca con tu MySQL local del 3306)
    volumes:
      - mysql_data:/var/lib/mysql
      # Crea las tablas y los usuarios de prueba la primera vez que arranca
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy   # espera a que MySQL esté listo
    environment:
      DB_HOST: mysql                  # nombre del servicio, no localhost
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-WauPiura}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-diego123}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/backend/uploads   # las imágenes subidas no se pierden

volumes:
  mysql_data:
  uploads_data:
