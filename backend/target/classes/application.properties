spring.application.name=proyecto

# Configuración de la conexión a MySQL.
# Los valores se leen del archivo .env (o variables de entorno).
# Si no existe .env, usa los valores por defecto tras los ":".
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:WauPiura}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Grissel123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Sesión: expira tras 30 min de inactividad.
# Para PROBAR el interceptor rápido, baja este valor (ej. 1m) y reinicia.
server.servlet.session.timeout=30m

# Subida de imágenes de mascotas
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB