spring.application.name=proyecto

# Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/WauPiura?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=diego123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Sesión: expira tras 30 min de inactividad.
# Para PROBAR el interceptor rápido, baja este valor (ej. 1m) y reinicia.
server.servlet.session.timeout=30m