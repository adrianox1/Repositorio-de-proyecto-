<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WauPiura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="auth-body">
  <header>
    <div class="container navbar">
      <div class="nav-left">
        <a href="index.html" class="logo"><span>Wau</span>Piura</a>
        <nav>
          <a href="index.html">Inicio</a>
          <a href="catalogo.html">Adopción</a>
          <a href="requisitos.html">Requisitos</a>
          <a href="nosotros.html">Nosotros</a>
          <a href="donaciones.html">Donaciones</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
      <div class="nav-auth">
        <a href="iniciar-sesion.html" class="btn-login">Iniciar Sesión</a>
        <a href="registro.html" class="btn-register">Registrarse</a>
      </div>
    </div>
  </header>

  <div class="auth-card">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;"><span>Wau</span>Piura</a>
    <h2>¡Bienvenido!</h2>
    <p>Ingresa tus credenciales.</p>
    <form class="auth-form" novalidate>
      <input type="email" placeholder="Correo electrónico" class="auth-input" required>
      <input type="password" placeholder="Contraseña" class="auth-input" required>
      <button type="submit" class="btn-register" style="background: var(--verde-menta-oscuro); color: white;">Entrar</button>
    </form>
    <p style="margin-top: 1.5rem; font-size: 0.9rem;">
      ¿No tienes cuenta? <a href="registro.html" class="auth-link">Regístrate</a>
    </p>
  </div>
  <script src="../scripts/global.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
