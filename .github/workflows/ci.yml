name: CI - Backend (compilar y testear)

# Se ejecuta automáticamente en cada push y en cada Pull Request.
# Corre en los servidores de GitHub (la nube), NO en tu PC ni en la de tu enamorada:
# basta con hacer "git push" desde cualquier laptop y GitHub lo ejecuta solo.
on:
  push:
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

# Credenciales del MySQL temporal del CI, definidas en UN SOLO lugar.
# Tu archivo .env local es independiente (no se sube a Git), así que
# cambiarlo NUNCA obliga a tocar este workflow.
env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_NAME: WauPiura
  DB_USER: root
  DB_PASSWORD: diego123

jobs:
  build:
    runs-on: ubuntu-latest

    # MySQL temporal con las credenciales del bloque env de arriba,
    # para que el test @SpringBootTest pueda conectarse al levantar el contexto.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr tests
        working-directory: backend
        # La app lee estas variables igual que del .env local (mismo nombre).
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: mvn -B clean verify
